# Opens a pull request when Vyasa publishes a release, with the manifest
# pointed at it and the sha256 of each archive computed from its bytes.
# A person still merges it: the manifest is what every Setu panel trusts.
name: vyasa release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view -R vyasa-cms/vyasa --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
      - name: Update the manifest
        id: bump
        run: echo "old=$(python3 tools/bump-vyasa.py '${{ steps.latest.outputs.tag }}')" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.bump.outputs.old != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
          OLD: ${{ steps.bump.outputs.old }}
        run: |
          branch="vyasa-${TAG#v}"
          if gh pr list --head "$branch" --state open --json number -q '.[0].number' | grep -q .; then
            echo "pull request for $branch already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "vyasa ${TAG#v}"
          git push --force -u origin "$branch"
          body="Vyasa $OLD → ${TAG#v}: https://github.com/vyasa-cms/vyasa/releases/tag/$TAG. Checksums computed by this workflow from the downloaded archives."
          # Where the organization does not let Actions open pull requests,
          # an issue links the pushed branch for a person to open one.
          if ! gh pr create --title "vyasa ${TAG#v}" --body "$body"; then
            if ! gh issue list --state open --search "vyasa ${TAG#v} in:title" --json number -q '.[0].number' | grep -q .; then
              gh issue create --title "vyasa ${TAG#v} is out" \
                --body "$body Open the pull request: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            fi
          fi
