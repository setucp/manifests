# Vyasa: a Rust CMS (one binary, PostgreSQL, admin at /admin).
# https://github.com/vyasa-cms/vyasa
schema = 1

[app]
id = "vyasa"
name = "Vyasa"
version = "0.4.3"
homepage = "https://github.com/vyasa-cms/vyasa"
health = "/readyz"
admin_path = "/admin"
startup_grace_s = 90

[run]
kind = "binary"
workdir = "exec_dir"
args = ["serve"]
[run.binary."x86_64-linux"]
url = "https://github.com/vyasa-cms/vyasa/releases/download/v0.4.3/vyasa-0.4.3-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "893381333adf7b1f01a5587eaea6f37417579154c953dc26b8f5118f8eaa7eea"
exec = "vyasa-0.4.3-x86_64-unknown-linux-gnu/vyasa"
[run.binary."aarch64-linux"]
url = "https://github.com/vyasa-cms/vyasa/releases/download/v0.4.3/vyasa-0.4.3-aarch64-unknown-linux-gnu.tar.gz"
sha256 = "ea8182344eb8660f614bf8c7bc9dd33f2e9b7a90d686e04644c27f4dfc9e3cb0"
exec = "vyasa-0.4.3-aarch64-unknown-linux-gnu/vyasa"

[needs]
postgres = ">=16"
dirs = ["media", "index", "registry"]

[env]
VYASA_BIND_ADDR      = { from = "bind_addr" }
VYASA_DATABASE_URL   = { from = "postgres_url" }
VYASA_SECRET_KEY     = { generate = "hex32", secret = true }
VYASA_MEDIA_DIR      = { from = "dir", dir = "media" }
VYASA_INDEX_DIR      = { from = "dir", dir = "index" }
VYASA_REGISTRY_DIR   = { from = "dir", dir = "registry" }
VYASA_RUN_DIR        = { from = "run_dir" }
VYASA_TRUSTED_PROXIES = { value = "127.0.0.1" }
VYASA_ADMIN_EMAIL    = { from = "owner_email" }
VYASA_ADMIN_PASSWORD = { generate = "password20", secret = true, once = true }

[limits.default]
memory_mb = 512
cpu_percent = 100
disk_mb = 5120

[backup]
postgres = true
dirs = ["media", "registry"]

[update]
strategy = "replace"
